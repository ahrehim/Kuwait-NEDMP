<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environmental Data Governance Web Portal | West Asia Workshop</title>
    <!-- Firebase SDKs for Online Cloud Backend -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --unep-blue: #00875a;
            --unep-teal: #00a884;
            --unep-dark: #0f2d3d;
            --unep-light: #f4f8f7;
            --accent-gold: #e6a100;
            --text-dark: #2c3e50;
            --border-color: #dcdfe6;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--unep-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--unep-dark) 0%, #1a4f66 100%);
            color: white;
            padding: 1.5rem 1.5rem 2rem 1.5rem;
            border-bottom: 5px solid var(--unep-teal);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .header-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-box {
            display: flex;
            align-items: center;
            max-height: 55px;
        }

        .logo-box img {
            max-height: 50px;
            width: auto;
            object-fit: contain;
        }

        .header-main-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .header-titles h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            color: #ffffff;
        }

        .header-titles h2 {
            font-size: 1.1rem;
            color: var(--unep-teal);
            font-weight: 400;
        }

        .header-badges {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .header-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            width: 100%;
            justify-content: flex-end;
        }

        .header-action-btn {
            background: rgba(255,255,255,0.14);
            color: white;
            border: 1px solid rgba(255,255,255,0.42);
            border-radius: 6px;
            padding: 0.62rem 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .header-action-btn:hover {
            background: white;
            color: var(--unep-dark);
        }

        .badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        nav {
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            overflow-x: auto;
        }

        .nav-btn {
            padding: 1rem 1.3rem;
            border: none;
            background: none;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .nav-btn:hover {
            color: var(--unep-blue);
            background-color: #f8faf9;
        }

        .nav-btn.active {
            color: var(--unep-blue);
            border-bottom-color: var(--unep-blue);
            background-color: #f0f7f4;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--card-shadow);
            border-left: 4px solid var(--unep-blue);
        }

        .card h3 {
            color: var(--unep-dark);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--unep-dark);
            font-size: 0.9rem;
        }

        input[type="text"], input[type="email"], input[type="url"], input[type="password"], input[type="file"], select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fafafa;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus, input[type="email"]:focus, input[type="url"]:focus, input[type="password"]:focus, input[type="file"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--unep-blue);
            background-color: #ffffff;
        }

        button.btn-submit {
            background-color: var(--unep-blue);
            color: white;
            padding: 0.8rem 1.8rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button.btn-submit:hover {
            background-color: #006a46;
        }

        button.btn-submit:disabled,
        button.btn-secondary:disabled {
            opacity: 0.52;
            cursor: not-allowed;
        }

        button.btn-submit:disabled:hover { background-color: var(--unep-blue); }

        button.btn-secondary {
            background-color: #6c757d;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }

        button.btn-secondary:hover {
            background-color: #495057;
        }

        .agenda-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .agenda-table th, .agenda-table td {
            padding: 0.85rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .agenda-table th {
            background-color: var(--unep-dark);
            color: white;
        }

        .agenda-table tr:hover {
            background-color: #f9fbfb;
        }

        .break-row {
            background-color: #f0f4f6;
            font-style: italic;
            font-weight: 600;
        }

        .tag {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            background: #eef7f4;
            color: var(--unep-blue);
        }

        .result-card {
            background: #ffffff;
            border: 1px solid #e1e6e8;
            border-radius: 6px;
            padding: 1.2rem;
            margin-bottom: 1rem;
        }

        .pillar-badge {
            background: #e8f4f8;
            color: #1a4f66;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .status-indicator {
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
        }

        .status-online { background-color: #d4edda; color: #155724; }
        .status-offline { background-color: #fff3cd; color: #856404; }

        .day-panel {
            background: #eef7f4;
            padding: 1rem;
            border-radius: 6px;
            margin: 1rem 0;
            border-left: 4px solid var(--unep-blue);
        }

        .day-panel h4 { color: var(--unep-dark); }

        .day-panel p {
            font-size: 0.9rem;
            color: #555;
        }

        .agenda-title-banner {
            background: var(--unep-blue);
            color: white !important;
            margin: -1.8rem -1.8rem 1.2rem;
            padding: 1.15rem 1.8rem;
            border-radius: 8px 8px 0 0;
        }

        .exercise-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
            margin: 0.8rem 0 1.2rem;
        }

        .exercise-note {
            background: #f7faf9;
            border: 1px solid #dce9e4;
            border-radius: 6px;
            padding: 0.9rem 1rem;
            margin: 1rem 0;
        }

        .exercise-note p + p { margin-top: 0.35rem; }

        .question-block {
            border-top: 1px solid var(--border-color);
            padding-top: 1.15rem;
            margin-top: 1.15rem;
        }

        .question-help {
            color: #60717b;
            font-size: 0.84rem;
            margin: -0.15rem 0 0.65rem;
        }

        .choice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
            gap: 0.6rem;
        }

        .choice-option {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            border: 1px solid var(--border-color);
            background: #fafcfb;
            border-radius: 6px;
            padding: 0.7rem 0.8rem;
            cursor: pointer;
            font-weight: 500;
            line-height: 1.35;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .choice-option:hover {
            border-color: var(--unep-teal);
            background: #f1faf7;
        }

        .choice-option:has(input:checked) {
            border-color: var(--unep-blue);
            background: #e8f5f0;
            box-shadow: inset 0 0 0 1px var(--unep-blue);
        }

        .choice-option input {
            accent-color: var(--unep-blue);
            margin-top: 0.2rem;
            flex: 0 0 auto;
        }

        .add-option-row {
            display: flex;
            gap: 0.55rem;
            margin-top: 0.7rem;
            align-items: stretch;
        }

        .add-option-row input { flex: 1; }

        .add-option-row button {
            border: 1px solid var(--unep-blue);
            color: var(--unep-blue);
            background: white;
            border-radius: 6px;
            padding: 0.65rem 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .add-option-row button:hover { background: #eef7f4; }

        .form-message {
            display: none;
            margin-top: 1rem;
            padding: 0.75rem 0.9rem;
            border-radius: 6px;
            background: #d4edda;
            color: #155724;
            font-weight: 600;
        }

        .dashboard-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .dashboard-stat {
            background: #f0f7f4;
            padding: 1rem;
            border-radius: 6px;
            text-align: center;
        }

        button.dashboard-stat {
            width: 100%;
            border: 1px solid #d6e7e1;
            color: var(--text-dark);
            cursor: pointer;
            font: inherit;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        button.dashboard-stat:hover,
        button.dashboard-stat:focus-visible {
            transform: translateY(-2px);
            border-color: var(--unep-blue);
            box-shadow: 0 6px 16px rgba(15,45,61,0.12);
            outline: none;
        }

        button.dashboard-stat::after {
            content: 'Open reports';
            display: block;
            margin-top: 0.55rem;
            color: var(--unep-blue);
            font-size: 0.76rem;
            font-weight: 700;
        }

        .dashboard-stat h4 {
            font-size: 1.8rem;
            color: var(--unep-blue);
        }

        .dashboard-stat p {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .empty-state { color: #6d7d85; font-style: italic; }

        body.portal-locked header,
        body.portal-locked nav,
        body.portal-locked main {
            display: none;
        }

        .access-shell {
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--unep-dark) 0%, #1a4f66 60%, var(--unep-blue) 100%);
        }

        .access-card {
            width: min(760px, 100%);
            background: white;
            border-radius: 10px;
            box-shadow: 0 18px 48px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        .access-heading {
            padding: 1.6rem 1.8rem;
            background: var(--unep-dark);
            color: white;
            border-bottom: 5px solid var(--unep-teal);
        }

        .access-heading h1 {
            font-size: 1.55rem;
            line-height: 1.3;
        }

        .access-heading p {
            color: #cfe7e0;
            margin-top: 0.35rem;
        }

        .access-body { padding: 1.8rem; }

        .access-error {
            display: none;
            padding: 0.7rem 0.85rem;
            margin-bottom: 1rem;
            border-radius: 6px;
            background: #f8d7da;
            color: #842029;
            font-weight: 600;
        }

        .admin-gate {
            max-width: 560px;
            margin: 0 auto;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .analytics-chart {
            background: #f8fbfa;
            border: 1px solid #e0eae6;
            border-radius: 7px;
            padding: 1rem;
        }

        .analytics-chart h4 {
            color: var(--unep-dark);
            margin-bottom: 0.8rem;
        }

        .bar-row {
            display: grid;
            grid-template-columns: minmax(115px, 1.1fr) minmax(120px, 2fr) 42px;
            gap: 0.6rem;
            align-items: center;
            margin: 0.55rem 0;
            font-size: 0.82rem;
        }

        .bar-track {
            height: 14px;
            background: #e1ebe7;
            border-radius: 8px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            min-width: 0;
            background: linear-gradient(90deg, var(--unep-blue), var(--unep-teal));
            border-radius: 8px;
        }

        .insight-list {
            padding-left: 1.2rem;
            margin-top: 0.65rem;
        }

        .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .document-item {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: center;
            padding: 1rem;
            border: 1px solid #e0e8e5;
            border-radius: 7px;
            margin-top: 0.8rem;
            background: #fafcfb;
        }

        .document-item a {
            color: var(--unep-blue);
            font-weight: 700;
            text-decoration: none;
        }

        .document-item a:hover { text-decoration: underline; }

        .document-meta {
            color: #6b7c84;
            font-size: 0.82rem;
            margin-top: 0.2rem;
        }

        .upload-progress {
            display: none;
            margin-top: 0.8rem;
            padding: 0.7rem 0.85rem;
            border-radius: 6px;
            background: #e8f4f8;
            color: #1a4f66;
            font-weight: 600;
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.7rem;
            margin-top: 1rem;
        }

        .exercise-access-gate {
            border: 1px solid #cfe1da;
            border-left: 5px solid var(--unep-blue);
            border-radius: 7px;
            background: #f5faf8;
            padding: 1.15rem;
            margin-top: 1.2rem;
        }

        .exercise-access-gate h4 { color: var(--unep-dark); }

        .exercise-access-form {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) auto;
            gap: 0.7rem;
            align-items: end;
            margin-top: 0.8rem;
        }

        .exercise-access-form .form-group { margin: 0; }

        .inline-error {
            display: none;
            grid-column: 1 / -1;
            color: #842029;
            background: #f8d7da;
            border-radius: 5px;
            padding: 0.65rem 0.8rem;
            font-weight: 600;
        }

        .password-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem 0.8rem;
            margin-top: 0.55rem;
            border: 1px solid #dde8e4;
            background: #fafcfb;
            border-radius: 6px;
        }

        .service-diagnostics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 0.65rem;
            margin: 1rem 0;
        }

        .service-diagnostic {
            border: 1px solid #dce7e3;
            border-radius: 6px;
            padding: 0.7rem 0.8rem;
            background: #fafcfb;
            font-size: 0.84rem;
        }

        .service-diagnostic strong { display: block; color: var(--unep-dark); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 4000;
            display: none;
            place-items: center;
            padding: 1.2rem;
            background: rgba(10, 31, 42, 0.72);
        }

        .modal-overlay.open { display: grid; }

        .modal-dialog {
            width: min(650px, 100%);
            max-height: 90vh;
            overflow: auto;
            background: white;
            border-radius: 9px;
            padding: 1.5rem;
            box-shadow: 0 22px 60px rgba(0,0,0,0.3);
            border-top: 6px solid var(--unep-blue);
        }

        .modal-dialog h3 { color: var(--unep-dark); }

        .online-required {
            border-left: 4px solid var(--accent-gold);
            background: #fff8e5;
            padding: 0.75rem 0.9rem;
            border-radius: 5px;
            margin-top: 0.8rem;
        }

        @media (max-width: 700px) {
            .agenda-table { display: block; overflow-x: auto; }
            .add-option-row { flex-direction: column; }
            .bar-row { grid-template-columns: 100px minmax(90px, 1fr) 32px; }
            .exercise-access-form { grid-template-columns: 1fr; }
        }

        @media print {
            nav, .btn-submit, .btn-secondary, .status-indicator, .add-option-row { display: none; }
            body { background: white; }
            .card { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body class="portal-locked">

    <header>
        <div class="header-container">
            <!-- Header Logos Bar -->

            function promiseWithTimeout2026(promise, timeoutMilliseconds, message) {

                        reject(new Error(message || 'The online request timed out.'));

                        completed = true;
                        window.clearTimeout(timer);

                    var timer = window.setTimeout(function () {

                        var permitted = effectiveExercisePasswords2026(exercise.id).some(function (entry) {

                        });
                        if (!permitted) {
                            errorBox.textContent = 'Incorrect exercise password. Please check with the facilitator.';
                            errorBox.style.display = 'block';
                            input.select();
                            return;

                        grantExerciseAccess2026(exercise.id);

                if (!online2026 || !firebaseConnected2026 || !database2026) {

                }
                return database2026.ref(key).push(record);

            function handleExerciseSubmit2026(event, exercise) {
                event.preventDefault();
                var form = event.currentTarget;
                var answers = [];

                for (var i = 0; i < exercise.questions.length; i += 1) {
                    var question = exercise.questions[i];
                    var questionId = question[0];
                    var questionText = question[1];
                    var questionType = question[3];
                    if (questionType === 'text') {
                        var textControl = document.getElementById(exercise.id + '-' + questionId);
                        var textValue = textControl.value.trim();
                        if (!textValue) {
                            window.alert('Please complete: ' + questionText);
                            textControl.focus();
                            return;
                        }
                        answers.push({ question: questionText, response: textValue });
                    } else {
                        var selected = Array.prototype.map.call(
                            form.querySelectorAll('[name="' + exercise.id + '-' + questionId + '"]:checked'),
                            function (input) { return input.value; }
                        );
                        if (!selected.length) {
                            window.alert('Please select at least one response for: ' + questionText);
                            document.getElementById(exercise.id + '-' + questionId + '-choices').scrollIntoView({ behavior: 'smooth', block: 'center' });
                            return;
                        }
                        answers.push({
                            question: questionText,
                            response: questionType === 'single' ? selected[0] : selected
                        });
                    }
                }

                var now = new Date();
                var record = {
                    exerciseId: exercise.id,
                    exerciseTitle: exercise.title,
                    participantId: participant2026 ? participant2026.id : '',
                    participantName: participant2026 ? participant2026.name : '',
                    participantInstitution: participant2026 ? participant2026.institution : '',
                    participantRole: participant2026 ? (participant2026.role || '') : '',
                    country: document.getElementById(exercise.id + '-country').value,
                    group: document.getElementById(exercise.id + '-group').value.trim(),
                    answers: answers,
                    comments: document.getElementById(exercise.id + '-comments').value.trim(),
                    timestamp: now.toISOString(),
                    displayTime: now.toLocaleString()
                };

                var submitButton = form.querySelector('button[type="submit"]');
                submitButton.disabled = true;
                submitButton.textContent = 'Saving online...';
                saveRecord2026(exercise.key, record).then(function () {
                    lastSubmittedRecords2026[exercise.id] = record;
                    var reportButton = document.getElementById(exercise.id + '-group-report');
                    if (reportButton) {
                        reportButton.disabled = false;
                        reportButton.title = 'Open a presentation-ready report of this submitted group response.';
                    }
                    var message = document.getElementById(exercise.id + '-message');
                    message.textContent = 'Submission saved to the live workshop database. The Group Report button is now available.';
                    message.style.background = '#d4edda';
                    message.style.color = '#155724';
                    message.style.display = 'block';
                    form.reset();
                    if (participant2026 && participant2026.country) {
                        document.getElementById(exercise.id + '-country').value = participant2026.country;
                    }
                    if (participant2026 && participant2026.workingGroup) {
                        document.getElementById(exercise.id + '-group').value = participant2026.workingGroup;
                    }
                    window.setTimeout(function () {
                        message.style.display = 'none';
                    }, 6000);
                    renderDashboard2026();
                }).catch(function (error) {
                    console.warn('The exercise submission was not saved online.', error);
                    var message = document.getElementById(exercise.id + '-message');
                    message.textContent = 'The submission could not be saved online. No local copy was created; please check the connection and try again.';
                    message.style.background = '#f8d7da';
                    message.style.color = '#842029';
                    message.style.display = 'block';
                }).finally(function () {
                    submitButton.disabled = false;
                    submitButton.textContent = 'Submit Exercise ' + (exercises2026.indexOf(exercise) + 1);
                });
            }

            function normalizePublicDocumentUrl2026(value) {
                var parsed;
                try {
                    parsed = new URL(String(value || '').trim());
                } catch (error) {
                    throw new Error('Enter a complete web address, including https://.');
                }
                if (parsed.protocol !== 'https:') throw new Error('The document link must begin with https://.');

                var host = parsed.hostname.toLowerCase();
                if (host === 'drive.google.com') {
                    var fileMatch = parsed.pathname.match(/^\/file\/d\/([a-zA-Z0-9_-]+)/);
                    var queryId = parsed.searchParams.get('id');
                    var driveId = fileMatch ? fileMatch[1] : queryId;
                    if (driveId) return 'https://drive.google.com/file/d/' + driveId + '/view';
                }
                parsed.hash = '';
                return parsed.href;
            }

            function documentLinkProvider2026(publicUrl) {
                var host = new URL(publicUrl).hostname.toLowerCase();
                if (host.indexOf('drive.google.com') >= 0 || host.indexOf('docs.google.com') >= 0) return 'Google Drive link';
                if (host.indexOf('sharepoint.com') >= 0 || host.indexOf('1drv.ms') >= 0 || host.indexOf('onedrive.live.com') >= 0) return 'Microsoft document link';
                if (host.indexOf('dropbox.com') >= 0) return 'Dropbox link';
                if (host.indexOf('github.com') >= 0 || host.indexOf('githubusercontent.com') >= 0) return 'GitHub document link';
                return 'External document link';
            }

                    if (!testWindow) throw new Error('The browser blocked the test window. Allow pop-ups and try again.');
                    testWindow.opener = null;
                    showUploadMessage2026('The link opened in a new tab. Confirm that the document is accessible without requesting permission, then publish it.', 'progress');
                } catch (error) {
                    showUploadMessage2026(error.message || 'The document link could not be tested.', 'error');
                    input.focus();
                }
            }

                        url: publicUrl,
                        storagePath: '',
                        source: 'public-link',
                        uploadedAt: now.toISOString(),
                        displayTime: now.toLocaleString(),
                        uploadedBy: participant2026 ? participant2026.name : 'Workshop administrator',
                        uploadedByRole: participant2026 ? (participant2026.role || '') : 'Administrator'
                    };
                    await publishDocumentMetadata2026(metadata);
                    titleInput.value = '';
                    urlInput.value = '';
                    showUploadMessage2026('Document link published successfully. It is now available under Workshop Documents.', 'success');
                } catch (error) {
                    console.warn('Document link publishing failed.', error);
                    var message = String(error && error.message || '');
                    if (/permission.denied|permission_denied|denied/i.test(message)) {
                        showUploadMessage2026('The online database did not permit the document link to be saved. Update the Realtime Database rule for workshop_documents, then try again.', 'error');
                    } else if (/timed out/i.test(message)) {
                        showUploadMessage2026('Publishing the link timed out. Check the internet connection and try again.', 'error');
                    } else {
                        showUploadMessage2026('The document link could not be published: ' + (message || 'unknown online database error'), 'error');
                    }
                } finally {
                    submitButton.disabled = false;
                }
            }

            function buildDocumentUploadCard2026() {
                var card = createElement2026('div', 'card');
                card.appendChild(createElement2026('h3', '', 'Publish Workshop Document Links'));

                form.addEventListener('submit', publishWorkshopDocumentLink2026);

            function openAdministratorReportDialog2026(exercise) {
                selectedAdministratorReportExercise2026 = exercise;
                var modal = document.getElementById('administrator-report-modal');
                var title = document.getElementById('administrator-report-modal-title');
                var message = document.getElementById('administrator-report-modal-message');
                var selector = document.getElementById('administrator-report-scope');
                if (!modal || !title || !selector) return;
                title.textContent = 'Exercise ' + (exercises2026.indexOf(exercise) + 1) + ' Reports';
                selector.value = 'all';
                if (message) {
                    message.textContent = (liveData2026[exercise.key] || []).length + ' submission(s) are currently available for ' + exercise.short + '.';
                }
                modal.classList.add('open');
                modal.setAttribute('aria-hidden', 'false');
                selector.focus();
            }

            function closeAdministratorReportDialog2026() {
                var modal = document.getElementById('administrator-report-modal');
                if (modal) {
                    modal.classList.remove('open');
                    modal.setAttribute('aria-hidden', 'true');
                }
            }

            function generateAdministratorSelectedReport2026() {
                var exercise = selectedAdministratorReportExercise2026;
                var selector = document.getElementById('administrator-report-scope');
                if (!exercise || !selector) return;
                var records = liveData2026[exercise.key] || [];
                if (selector.value === 'all') {
                    generateConsolidatedExerciseReport2026(exercise, records);
                } else {
                    var groupRecords = records.filter(function (record) { return record.group === selector.value; });
                    var latest = latestGroupSubmissions2026(groupRecords)[0];
                    if (!latest) {
                        window.alert('No submission is available for ' + selector.value + ' in this exercise.');
                        return;
                    }
                    generateGroupReport2026(exercise, latest);
                }
            }

            function buildAdministratorReportModal2026() {
                var overlay = createElement2026('div', 'modal-overlay');
                overlay.id = 'administrator-report-modal';
                overlay.setAttribute('role', 'dialog');
                overlay.setAttribute('aria-modal', 'true');
                overlay.setAttribute('aria-hidden', 'true');
                overlay.addEventListener('click', function (event) {
                    if (event.target === overlay) closeAdministratorReportDialog2026();
                });
                var dialog = createElement2026('div', 'modal-dialog');
                var title = createElement2026('h3', '', 'Exercise Reports');
                title.id = 'administrator-report-modal-title';
                dialog.appendChild(title);
                dialog.appendChild(createElement2026('p', '', 'Choose a single working group report or a consolidated report that compares the latest response from every group. Reports open in a professional presentation and print layout.'));
                var group = createElement2026('div', 'form-group');
                group.style.marginTop = '1rem';
                var label = createElement2026('label', '', 'Report scope');
                label.htmlFor = 'administrator-report-scope';
                var selector = document.createElement('select');
                selector.id = 'administrator-report-scope';
                var consolidated = createElement2026('option', '', 'All groups — consolidated report');
                consolidated.value = 'all';
                selector.appendChild(consolidated);
                workingGroups2026.forEach(function (workingGroup) {
                    var option = createElement2026('option', '', workingGroup + ' — latest submitted response');
                    option.value = workingGroup;
                    selector.appendChild(option);
                });
                group.appendChild(label);
                group.appendChild(selector);
                dialog.appendChild(group);
                var message = createElement2026('p', 'online-required');
                message.id = 'administrator-report-modal-message';
                dialog.appendChild(message);
                var actions = createElement2026('div', 'form-actions');
                var generate = createElement2026('button', 'btn-submit', 'Generate report');
                generate.type = 'button';
                generate.addEventListener('click', generateAdministratorSelectedReport2026);
                var cancel = createElement2026('button', 'btn-secondary', 'Cancel');
                cancel.type = 'button';
                cancel.addEventListener('click', closeAdministratorReportDialog2026);
                actions.appendChild(generate);
                actions.appendChild(cancel);
                dialog.appendChild(actions);
                overlay.appendChild(dialog);
                return overlay;
            }

            function buildDashboard2026() {
                var section = createElement2026('section', 'tab-content');
                section.id = 'backend';

                var gate = createElement2026('div', 'card admin-gate');
                gate.id = 'administrator-gate';
                gate.appendChild(createElement2026('h3', '', 'Administrator access'));
                gate.appendChild(createElement2026('p', '', 'Enter the administrator password to view participant registrations, exercise findings and workshop analytics.'));
                var gateError = createElement2026('div', 'access-error');
                gateError.style.marginTop = '1rem';
                gate.appendChild(gateError);
                var gateForm = document.createElement('form');
                gateForm.style.marginTop = '1rem';
                var passwordGroup = registrationField2026('administrator-password', 'Administrator password', 'password', true, 'Enter the backend password');
                gateForm.appendChild(passwordGroup);
                var unlockButton = createElement2026('button', 'btn-submit', 'Open administration dashboard');
                unlockButton.type = 'submit';
                gateForm.appendChild(unlockButton);
                gateForm.addEventListener('submit', async function (event) {
                    event.preventDefault();
                    await unlockAdministrator2026(document.getElementById('administrator-password').value, gateError);
                });
                gate.appendChild(gateForm);

                var adminContent = document.createElement('div');
                adminContent.id = 'administrator-content';
                adminContent.style.display = administratorUnlocked2026() ? 'block' : 'none';

                var topCard = createElement2026('div', 'card');

                top.style.display = 'flex';
                top.style.justifyContent = 'space-between';
                top.style.alignItems = 'center';
                top.style.flexWrap = 'wrap';
                top.style.gap = '1rem';

                var heading = createElement2026('div');
                heading.appendChild(createElement2026('h3', '', 'Regional Workshop Administration & Analytics'));
                heading.appendChild(createElement2026('p', '', 'Protected analysis of participant registrations and the seven revised country and working-group exercises.'));
                var actions = createElement2026('div');
                var status = createElement2026('span', 'status-indicator status-offline', 'Connecting Online Database...');
                status.id = 'backend-status';
                actions.appendChild(status);
                top.appendChild(heading);
                top.appendChild(actions);
                topCard.appendChild(top);
                topCard.appendChild(createElement2026('p', 'online-required', 'GitHub Pages deployment is supported. Registrations, exercise submissions, password settings and workshop document links use the configured Firebase Realtime Database. Documents remain hosted in their original trusted repositories. No persistent local fallback is used.'));

                var summary = createElement2026('div', 'dashboard-summary');
                exercises2026.forEach(function (exercise, index) {
                    var stat = createElement2026('button', 'dashboard-stat');
                    stat.type = 'button';
                    stat.title = 'Choose a group report or an all-groups consolidated report';
                    stat.setAttribute('aria-label', 'Open reports for Exercise ' + (index + 1) + ': ' + exercise.short);
                    stat.addEventListener('click', function () { openAdministratorReportDialog2026(exercise); });
                    var number = createElement2026('h4', '', '0');
                    number.id = 'count-' + exercise.id;
                    stat.appendChild(number);
                    stat.appendChild(createElement2026('p', '', 'Exercise ' + (index + 1) + ': ' + exercise.short));
                    summary.appendChild(stat);
                });
                topCard.appendChild(summary);

                var adminActions = createElement2026('div', 'admin-actions');
                var printButton = createElement2026('button', 'btn-secondary', '🖨️ Print / Export PDF');
                printButton.type = 'button';
                printButton.addEventListener('click', function () { window.print(); });
                var jsonButton = createElement2026('button', 'btn-secondary', 'Export JSON');
                jsonButton.type = 'button';
                jsonButton.addEventListener('click', exportJson2026);
                var csvButton = createElement2026('button', 'btn-secondary', 'Export CSV');
                csvButton.type = 'button';
                csvButton.addEventListener('click', exportCsv2026);
                adminActions.appendChild(printButton);
                adminActions.appendChild(jsonButton);
                adminActions.appendChild(csvButton);
                topCard.appendChild(adminActions);
                adminContent.appendChild(topCard);
                adminContent.appendChild(buildExercisePasswordManager2026());
                adminContent.appendChild(buildDocumentUploadCard2026());

                var analyticsCard = createElement2026('div', 'card');
                analyticsCard.appendChild(createElement2026('h3', '', 'Workshop Participation and Response Analysis'));
                var analyticsMetrics = createElement2026('div', 'dashboard-summary');
                analyticsMetrics.id = 'analytics-metrics';
                analyticsCard.appendChild(analyticsMetrics);
                var analyticsGrid = createElement2026('div', 'analytics-grid');
                analyticsGrid.style.marginTop = '1.5rem';
                var submissionsPanel = createElement2026('div', 'analytics-chart');
                submissionsPanel.appendChild(createElement2026('h4', '', 'Submissions by exercise'));
                var submissionsChart = document.createElement('div');
                submissionsChart.id = 'submissions-chart';
                submissionsPanel.appendChild(submissionsChart);
                var optionsPanel = createElement2026('div', 'analytics-chart');
                optionsPanel.appendChild(createElement2026('h4', '', 'Most frequently selected options'));
                var optionsChart = document.createElement('div');
                optionsChart.id = 'options-chart';
                optionsPanel.appendChild(optionsChart);
                analyticsGrid.appendChild(submissionsPanel);
                analyticsGrid.appendChild(optionsPanel);
                analyticsCard.appendChild(analyticsGrid);
                var insightPanel = createElement2026('div', 'analytics-chart');
                insightPanel.style.marginTop = '1.5rem';
                insightPanel.appendChild(createElement2026('h4', '', 'Automatic text summary'));
                var insights = document.createElement('div');
                insights.id = 'analytics-insights';
                insightPanel.appendChild(insights);
                analyticsCard.appendChild(insightPanel);
                adminContent.appendChild(analyticsCard);

                exercises2026.forEach(function (exercise, index) {
                    var resultsCard = createElement2026('div', 'card');
                    resultsCard.appendChild(createElement2026('h3', '', 'Exercise ' + (index + 1) + ': ' + exercise.title));
                    var results = document.createElement('div');
                    results.id = 'results-' + exercise.id;
                    results.appendChild(createElement2026('p', 'empty-state', 'No submissions yet.'));
                    resultsCard.appendChild(results);
                    adminContent.appendChild(resultsCard);
                });
                section.appendChild(adminContent);
                section.appendChild(buildAdministratorReportModal2026());
                if (administratorUnlocked2026()) gate.style.display = 'none';
                return section;
            }

            function startAdministratorDataSync2026() {
                if (administratorSyncStarted2026 || !administratorUnlocked2026() || !database2026) return;
                administratorSyncStarted2026 = true;
                database2026.ref('participant_registrations').on('value', function (snapshot) {
                    liveRegistrations2026 = snapshot.val() ? Object.values(snapshot.val()) : [];
                    renderAnalytics2026();
                }, function (error) {
                    console.warn('Could not synchronize participant registrations.', error);
                });
                exercises2026.forEach(function (exercise) {
                    database2026.ref(exercise.key).on('value', function (snapshot) {
                        liveData2026[exercise.key] = snapshot.val() ? Object.values(snapshot.val()) : [];
                        renderExerciseResults2026(exercise, liveData2026[exercise.key]);
                        renderAnalytics2026();
                    }, function (error) {
                        console.warn('Could not synchronize ' + exercise.key + '.', error);
                        var status = document.getElementById('backend-status');
                        if (status) {
                            status.textContent = '⚠️ Online database access error';
                            status.className = 'status-indicator status-offline';
                        }
                    });
                });
            }

            function initializeDataSync2026() {
                if (!database2026) connectFirebase2026();
                updateOnlineStatus2026();

                if (online2026 && database2026) {
                    database2026.ref('exercise_access_passwords').on('value', function (snapshot) {
                        liveExercisePasswordConfig2026 = snapshot.val() || {};
                        exercisePasswordConfigLoaded2026 = true;
                        renderExercisePasswordManager2026();
                    }, function (error) {
                        console.warn('Could not synchronize exercise password settings; requested default passwords remain active.', error);
                        exercisePasswordConfigLoaded2026 = false;
                        renderExercisePasswordManager2026();
                    });
                    database2026.ref('workshop_documents').on('value', function (snapshot) {
                        liveDocuments2026 = snapshot.val() ? Object.values(snapshot.val()) : [];
                        renderDocuments2026();
                    }, function (error) {
                        console.warn('Could not synchronize workshop documents.', error);
                        var documents = document.getElementById('workshop-document-list');
                        if (documents) {
                            documents.innerHTML = '';
                            documents.appendChild(createElement2026('p', 'empty-state', 'Workshop documents could not be retrieved from the online repository.'));
                        }
                    });
                    if (administratorUnlocked2026()) startAdministratorDataSync2026();
                } else {
                    updateOnlineStatus2026();
                    renderDocuments2026();
                }
            }

            function initializePortal2026() {
                document.body.classList.remove('portal-locked');
                buildNavigation2026();
                buildHeaderActions2026();
                var participantBadge = document.getElementById('participant-badge');
                if (participantBadge) participantBadge.remove();
                if (participant2026) {
                    participantBadge = createElement2026('span', 'badge', '👤 ' + participant2026.name +
                        (participant2026.role ? ' · ' + participant2026.role : '') +
                        ' · ' + participant2026.workingGroup);
                    participantBadge.id = 'participant-badge';
                    document.querySelector('.header-badges').appendChild(participantBadge);
                }
                var main = document.querySelector('main');
                main.innerHTML = '';
                main.appendChild(buildOverview2026());
                main.appendChild(buildAgenda2026());
                main.appendChild(buildDocuments2026());
                exercises2026.forEach(function (exercise, index) {
                    main.appendChild(buildExercise2026(exercise, index));
                });
                main.appendChild(buildDashboard2026());
                initializeDataSync2026();
            }

            window.addEventListener('DOMContentLoaded', startPortal2026);
        }());
    </script>
